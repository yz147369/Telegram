name: Build Telegram ARM64 Play No R8

on:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Xmx8g -Dorg.gradle.daemon=false"


    steps:


    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive


    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17


    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: ''


    - name: Install Android SDK
      run: |

        yes | sdkmanager --licenses

        sdkmanager \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;25.2.9519653"


    - name: Gradle Cache
      uses: actions/cache@v4
      with:

        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper

        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}


    # 临时关闭混淆，不提交源码
    - name: Disable R8

      run: |

        sed -i \
        's/minifyEnabled true/minifyEnabled false/g' \
        TMessagesProj_App/build.gradle


        sed -i \
        's/shrinkResources true/shrinkResources false/g' \
        TMessagesProj_App/build.gradle



    # 只编译 arm64-v8a
    - name: Set ARM64 ABI

      run: |

        sed -i \
        's/"armeabi-v7a", "arm64-v8a", "x86", "x86_64"/"arm64-v8a"/g' \
        TMessagesProj_App/build.gradle



    - name: Build Telegram Play APK

      run: |

        ./gradlew \
        :TMessagesProj_App:assembleAfatRelease \
        --no-daemon



    - name: Prepare APK

      run: |

        mkdir -p output


        cp \
        TMessagesProj/build/outputs/apk/afat/release/app.apk \
        output/Telegram-arm64-play-no-r8.apk



    - name: Upload APK

      uses: actions/upload-artifact@v4

      with:

        name: Telegram-arm64-play-no-r8

        path: output/*.apk
