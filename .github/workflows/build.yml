name: Build Telegram ARM64 Play No R8

on:

  workflow_dispatch:

  push:
    branches:
      - master


jobs:

  build:

    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Xmx8g -Dorg.gradle.daemon=false"


    steps:


    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive


    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17


    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: ''


    - name: Install Android SDK
      run: |

        yes | sdkmanager --licenses

        sdkmanager \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;25.2.9519653"


    - name: Gradle Cache
      uses: actions/cache@v4
      with:

        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper

        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}


    # 临时关闭混淆，不提交源码
    - name: Disable R8

      run: |

        sed -i \
        's/minifyEnabled true/minifyEnabled false/g' \
        TMessagesProj_App/build.gradle


        sed -i \
        's/shrinkResources true/shrinkResources false/g' \
        TMessagesProj_App/build.gradle



    # 只编译 arm64-v8a
    - name: Set ARM64 ABI

      run: |

        sed -i \
        's/"armeabi-v7a", "arm64-v8a", "x86", "x86_64"/"arm64-v8a"/g' \
        TMessagesProj_App/build.gradle



    - name: Build Telegram Play APK

      run: |

        ./gradlew \
        :TMessagesProj_App:assembleAfatRelease \
        --no-daemon


    - name: Read version
      id: version
      run: |
       APK=TMessagesProj_App/build/outputs/apk/afat/release/app.apk

       sudo apt-get update
       sudo apt-get install -y aapt

       VERSION_NAME=$(aapt dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
       VERSION_CODE=$(aapt dump badging "$APK" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")

       echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
       echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

    - name: Rename APK
      run: |
       mkdir -p output

       GIT_HASH=$(git rev-parse --short HEAD)

       cp \
        TMessagesProj_App/build/outputs/apk/afat/release/app.apk \
        "output/Telegram-v${{ steps.version.outputs.version_name }}(${{ steps.version.outputs.version_code }})-g${GIT_HASH}.apk"
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
       tag_name: v${{ steps.version.outputs.version_name }}-${{ github.sha }}
       name: Telegram v${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})
       generate_release_notes: true
       files: output/*.apk
      env:
       GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
