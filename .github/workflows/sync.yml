name: Sync Upstream Telegram

on:
  schedule:
    - cron: "15 14 * * *"

  workflow_dispatch:

jobs:
  sync:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Sync upstream
      run: |

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git remote add upstream https://github.com/DrKLO/Telegram.git || true

        git fetch upstream

        git checkout master

        git merge upstream/master --no-edit

        git push origin master
